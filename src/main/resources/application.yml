spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carservice}
    username: ${DB_USERNAME:carservice}
    password: carservice
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
